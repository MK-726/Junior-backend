<svg xmlns="http://www.w3.org/2000/svg" width="890" height="280" viewBox="0 0 890 280" role="img" aria-labelledby="t" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Git's three areas: working directory, staging area and repository, with the commands that move changes between them</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="888" height="278" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="30" y="60" width="160" height="130" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="110.0" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Working Directory</text>
  <text x="110.0" y="122" text-anchor="middle" font-size="14" fill="#0f172a">Your files on disk</text>
  <text x="110.0" y="144" text-anchor="middle" font-size="13" fill="#475569">You edit here</text>
  <rect x="365" y="60" width="160" height="130" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
  <text x="445.0" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#134e4a">Staging Area</text>
  <text x="445.0" y="122" text-anchor="middle" font-size="14" fill="#0f172a">Changes picked for</text>
  <text x="445.0" y="144" text-anchor="middle" font-size="14" fill="#0f172a">the next commit</text>
  <rect x="700" y="60" width="160" height="130" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="780.0" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#78350f">Repository</text>
  <text x="780.0" y="122" text-anchor="middle" font-size="14" fill="#0f172a">Saved snapshots</text>
  <text x="780.0" y="144" text-anchor="middle" font-size="13" fill="#475569">(commits)</text>
  <line x1="196" y1="105" x2="359" y2="105" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
  <line x1="531" y1="105" x2="694" y2="105" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="243.3" y="70.0" width="68.4" height="22" rx="11.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="277.5" y="85.2" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#0f172a">git add</text>
  <rect x="567.5" y="70.0" width="90.0" height="22" rx="11.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="612.5" y="85.2" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#0f172a">git commit</text>
  <line x1="359" y1="155" x2="196" y2="155" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <line x1="694" y1="155" x2="531" y2="155" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <rect x="228.9" y="170.0" width="97.2" height="22" rx="11.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="277.5" y="185.2" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#0f172a">git restore</text>
  <rect x="531.5" y="170.0" width="162.0" height="22" rx="11.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="612.5" y="185.2" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#0f172a">git restore --staged</text>
  <text x="445.0" y="252" text-anchor="middle" font-size="14" fill="#475569">Solid arrows move work forward. Dashed arrows undo it.</text>

</svg>
